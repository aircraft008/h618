name: Build H618 Kernel Deb

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare custom kernel config from original
        run: |
          mkdir -p userpatches
          # 1. 复制仓库原版完整内核配置
          cp config/kernel/linux-sunxi64-edge.config userpatches/linux-sunxi64-edge.config
          
          # 2. 清理可能冲突的旧配置行
          CONFIGS=(
            "CONFIG_IP_ADVANCED_ROUTER"
            "CONFIG_IP_MULTIPLE_TABLES"
            "CONFIG_IPV6"
            "CONFIG_IPV6_MULTIPLE_TABLES"
            "CONFIG_TUN"
            "CONFIG_WIREGUARD"
            "CONFIG_NETFILTER_TPROXY"
            "CONFIG_NETFILTER_XT_TARGET_TPROXY"
            "CONFIG_NETFILTER_XT_TARGET_MARK"
            "CONFIG_NETFILTER_XT_MATCH_MARK"
            "CONFIG_NETFILTER_XT_MATCH_SOCKET"
            "CONFIG_NETFILTER_XT_MATCH_CONNMARK"
            "CONFIG_NETFILTER_XT_TARGET_CONNMARK"
            "CONFIG_NF_TABLES"
            "CONFIG_NF_TABLES_INET"
            "CONFIG_NF_TABLES_IPV4"
            "CONFIG_NF_TABLES_IPV6"
            "CONFIG_NFT_TPROXY"
            "CONFIG_NFT_SOCKET"
            "CONFIG_NFT_NAT"
            "CONFIG_NFT_MASQ"
            "CONFIG_NFT_REDIR"
            "CONFIG_NFT_CT"
            "CONFIG_NFT_COMPAT"
            "CONFIG_TCP_CONG_ADVANCED"
            "CONFIG_TCP_CONG_BBR"
            "CONFIG_DEFAULT_BBR"
            "CONFIG_NET_SCH_FQ"
          )

          for cfg in "${CONFIGS[@]}"; do
            sed -i "/^${cfg}=/d" userpatches/linux-sunxi64-edge.config
            sed -i "/^# ${cfg} is not set/d" userpatches/linux-sunxi64-edge.config
          done
          
          # 3. 追加策略路由及旁路由/透明代理常用内核参数
          cat << 'EOF' >> userpatches/linux-sunxi64-edge.config
          # 策略路由与 IPv6
          CONFIG_IP_ADVANCED_ROUTER=y
          CONFIG_IP_MULTIPLE_TABLES=y
          CONFIG_IPV6=y
          CONFIG_IPV6_MULTIPLE_TABLES=y

          # TUN 虚拟网卡与 WireGuard 组网
          CONFIG_TUN=y
          CONFIG_WIREGUARD=m

          # TProxy 透明代理（兼容 iptables 与 nftables）
          CONFIG_NETFILTER_TPROXY=m
          CONFIG_NETFILTER_XT_TARGET_TPROXY=m
          CONFIG_NETFILTER_XT_TARGET_MARK=m
          CONFIG_NETFILTER_XT_MATCH_MARK=m
          CONFIG_NETFILTER_XT_MATCH_SOCKET=m
          CONFIG_NETFILTER_XT_MATCH_CONNMARK=m
          CONFIG_NETFILTER_XT_TARGET_CONNMARK=m

          # nftables 现代防火墙转发与 NAT 依赖
          CONFIG_NF_TABLES=m
          CONFIG_NF_TABLES_INET=y
          CONFIG_NF_TABLES_IPV4=y
          CONFIG_NF_TABLES_IPV6=y
          CONFIG_NFT_TPROXY=m
          CONFIG_NFT_SOCKET=m
          CONFIG_NFT_NAT=m
          CONFIG_NFT_MASQ=m
          CONFIG_NFT_REDIR=m
          CONFIG_NFT_CT=m
          CONFIG_NFT_COMPAT=m

          # TCP BBR 拥塞控制与 FQ 队列算法
          CONFIG_TCP_CONG_ADVANCED=y
          CONFIG_TCP_CONG_BBR=y
          CONFIG_DEFAULT_BBR=y
          CONFIG_NET_SCH_FQ=y
          EOF

      - name: Build Armbian Kernel Only
        run: |
          sudo -E COLUMNS=160 ./compile.sh kernel \
            BOARD=vontar-h618 \
            BRANCH=edge \
            KERNEL_CONFIGURE=no \
            INSTALL_HEADERS=yes

      - name: Upload Kernel Deb Packages
        uses: actions/upload-artifact@v4
        with:
          name: h618-kernel-debs
          path: output/debs/*.deb
