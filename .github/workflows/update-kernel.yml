name: Build H618 Kernel Deb

on:
  workflow_dispatch: # 支持在网页端手动点击运行

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Disable openvfd driver in patch
        run: |
          find patch/ -type f -name "*.patch" -exec sed -i '/openvfd/d' {} +

      - name: Build Armbian Kernel Only
        run: |
          sudo -E COLUMNS=160 ./compile.sh kernel \
            BOARD=vontar-h618 \
            BRANCH=edge \
            KERNEL_CONFIGURE=no \
            INSTALL_HEADERS=yes


      - name: Upload Kernel Deb Packages
        uses: actions/upload-artifact@v4
        with:
          name: h618-kernel-debs
          path: output/debs/*.deb
