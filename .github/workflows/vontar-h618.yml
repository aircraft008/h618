name: Build Vontar H618

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: 1. 拉取当前定制仓库代码
        uses: actions/checkout@v4

      - name: 2. 拉取上游 Armbian 构建脚本以修复 base-files 报错
        uses: actions/checkout@v4
        with:
          repository: armbian/build
          ref: main
          sparse-checkout: |
            lib/functions/artifacts/artifact-armbian-base-files.sh
            lib/functions/general/apt-utils.sh
          path: upstream-fix

      - name: 3. 覆盖修复旧版脚本并清理临时目录
        run: |
          cp -f upstream-fix/lib/functions/artifacts/artifact-armbian-base-files.sh lib/functions/artifacts/artifact-armbian-base-files.sh
          cp -f upstream-fix/lib/functions/general/apt-utils.sh lib/functions/general/apt-utils.sh
          rm -rf upstream-fix

      - name: 4. 注册 QEMU 跨架构支持
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: 5. 清理磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h

      - name: 6. 编译 Vontar H618 并压缩镜像
        run: |
          chmod +x compile.sh
          ./compile.sh \
            BOARD=vontar-h618 \
            BRANCH=edge \
            RELEASE=bookworm \
            BUILD_MINIMAL=no \
            BUILD_DESKTOP=no \
            KERNEL_CONFIGURE=no \
            COMPRESS_OUTPUTIMAGE=sha,img,xz \
            SHARE_LOG=yes
          ls -lh output/images/
          # 兜底检查：如果生成的仍是未压缩的 .img，则手动压缩为 .img.xz
          if ls output/images/*.img 1> /dev/null 2>&1; then
            xz -T0 -v output/images/*.img
          fi
          ls -lh output/images/

      - name: 7. 自动发布镜像到 Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: vontar-h618-${{ github.run_number }}
          name: Vontar H618 Custom #${{ github.run_number }}
          files: |
            output/images/*.img.xz
            output/images/*.sha
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
