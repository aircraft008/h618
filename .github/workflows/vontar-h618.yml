name: Build Vontar H618

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: 1. 拉取代码
        uses: actions/checkout@v4

      - name: 2. 注册 QEMU 跨架构支持
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: 3. 修复旧版构建脚本的 base-files jq 解析 Bug
        run: |
          git clone --depth=1 https://github.com /tmp/armbian-upstream
          cp -f /tmp/armbian-upstream/lib/functions/artifacts/artifact-armbian-base-files.sh lib/functions/artifacts/artifact-armbian-base-files.sh
          cp -f /tmp/armbian-upstream/lib/functions/general/apt-utils.sh lib/functions/general/apt-utils.sh
          rm -rf /tmp/armbian-upstream

      - name: 4. 清理磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h

      - name: 5. 编译 Vontar H618
        run: |
          chmod +x compile.sh
          ./compile.sh \
            BOARD=vontar-h618 \
            BRANCH=edge \
            RELEASE=bookworm \
            BUILD_MINIMAL=no \
            BUILD_DESKTOP=no \
            KERNEL_CONFIGURE=no \
            SHARE_LOG=yes

      - name: 6. 自动发布镜像到 Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: vontar-h618-${{ github.run_number }}
          name: Vontar H618 Custom #${{ github.run_number }}
          files: output/images/*.img.xz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
