name: Build Vontar H618

on:
  workflow_dispatch: # 仅当你手动在网页点击运行时才触发，省时省额度

permissions:
  contents: write # 允许自动创建 Release 并上传固件

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: 1. 拉取代码
        uses: actions/checkout@v4

      - name: 2. 清理 GitHub 虚拟机的多余软件以释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h

      - name: 3. 编译 Vontar H618 (Bookworm Edge 6.12)
        run: |
          chmod +x compile.sh
          ./compile.sh \
            BOARD=vontar-h618 \
            BRANCH=edge \
            RELEASE=bookworm \
            BUILD_MINIMAL=no \
            BUILD_DESKTOP=no \
            KERNEL_CONFIGURE=no \
            SHARE_LOG=yes

      - name: 4. 自动发布镜像到 Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: vontar-h618-${{ github.run_number }}
          name: Vontar H618 Custom #${{ github.run_number }}
          files: output/images/*.img.xz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
